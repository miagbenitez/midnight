<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0911" />
    <meta
      name="description"
      content="MIDNIGHT® — Desarrolladora digital independiente. Ideas que se convierten en experiencias digitales."
    />
    <meta property="og:title" content="MIDNIGHT® — Experiencias digitales" />
    <meta
      property="og:description"
      content="Un universo digital donde creatividad, diseño y programación se encuentran."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html.campusitec-preview,
      html.campusitec-preview body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b0911;
      }

      #campusite-preview iframe {
        display: block;
        width: 100%;
        height: 100vh;
        border: 0;
      }

      #campusite-preview .fallback {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 10px 14px;
        border: 1px solid #9b6dff;
        background: #171222;
        color: #f5f0ff;
        font: 14px system-ui, sans-serif;
        text-decoration: none;
      }

      #campusite-preview .fallback:focus-visible {
        outline: 2px solid #d7c4ff;
        outline-offset: 3px;
      }
    </style>
    <title>MIDNIGHT® — Experiencias digitales</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="campusite-preview" hidden>
      <iframe
        title="Portfolio MIDNIGHT de Mia Benítez"
        src="https://miagbenitez.github.io/midnight/"
        allow="fullscreen"
        loading="eager"
      ></iframe>
      <a class="fallback" href="https://miagbenitez.github.io/midnight/" target="_blank" rel="noopener noreferrer">
        Abrir portfolio en otra pestaña
      </a>
    </div>
    <script type="module">
      if (/(^|\.)campusitec\.com$/i.test(window.location.hostname)) {
        document.documentElement.classList.add('campusitec-preview')
        document.getElementById('root')?.setAttribute('hidden', '')
        document.getElementById('campusite-preview')?.removeAttribute('hidden')
      } else {
        import('./src/main.tsx')
      }
    </script>
  </body>
</html>
